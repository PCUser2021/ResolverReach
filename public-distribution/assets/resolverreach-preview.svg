<rect x="13" y="79" width="1574" height="115" fill="#F44336"/><text x="43" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Ready to check DNS resolvers</text><text x="43" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#FFF1EF">Choose Test cURL Resolvers or paste HTTPS endpoints and click Test Resolvers.</text><rect x="1420" y="118" width="130" height="38" rx="19" fill="#E45B52" stroke="#FFF1EF" stroke-width="2"/><text x="1443" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">DoH CHECK</text>
