name: Windows x64 build and installer

on:
  push:
    branches: [main, reactiveui-frp-refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ResolverReach/ResolverReach.csproj

      - name: Publish self-contained x64 application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/publish, artifacts/installer | Out-Null
          dotnet publish src/ResolverReach/ResolverReach.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=2.1.0 --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=2.1.0 "installer/ResolverReach.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "artifacts/installer/ResolverReach-Setup-x64.exe")) {
            throw "Expected installer output was not created."
          }

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: ResolverReach-Windows-x64
          path: artifacts/installer/ResolverReach-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14


  publish-release:
    name: Publish tested v2.1.0 release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')
    needs: build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer from the successful build
        uses: actions/download-artifact@v4
        with:
          name: ResolverReach-Windows-x64
          path: artifacts/installer

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v2.1.0
          target_commitish: ${{ github.sha }}
          name: Resolver Reach 2.1.0
          body: |
            Resolver Reach 2.1.0 — Windows 11 x64

            A single-window DNS-over-HTTPS reachability tester.

            - Test the live cURL resolver catalog.
            - Paste and test your own HTTPS DoH endpoints.
            - Validate RFC 8484 DNS replies and view HTTP status, latency, and DNS details in the main window.
            - License: MIT. Original project source may be used for any purpose under the license terms.
          files: |
            artifacts/installer/ResolverReach-Setup-x64.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
