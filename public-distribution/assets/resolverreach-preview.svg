<circle cx="94" cy="268" r="3" fill="#C27CFF"/><text x="126" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F7F8FA">1. Test cURL Resolvers</text><text x="126" y="301" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#D1D5DB">Fetch the current curl/curl DNS-over-HTTPS wiki and test unique HTTPS Base URLs.</text><text x="126" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#D1D5DB">The live catalog is refreshed for each run.</text><rect x="1284" y="252" width="256" height="59" rx="8" fill="#F22E8C" stroke="#FF75B7" stroke-width="2"/><text x="1310" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Test cURL Resolvers</text>
<rect x="31" y="359" width="1538" height="195" rx="13" fill="#50555C" stroke="#666C73" stroke-width="2"/><path d="M55 385h19l7 7v20H55z" fill="#17263A" stroke="#9BAFC6" stroke-width="1.8"/>
<path d="M74 385v7h7M59 402h15M59 407h11" fill="none" stroke="#4DDBF7" stroke-width="1.7"/>
<text x="91" y="404" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F7F8FA">2. Paste links</text><text x="55" y="436" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#D1D5DB">Paste one or more HTTPS DoH endpoint URLs, one per line or separated with semicolons.</text><rect x="53" y="447" width="1208" height="85" rx="8" fill="#41464C" stroke="#666C73" stroke-width="2"/><text x="70" y="479" font-family="Consolas,monospace" font-size="15" fill="#E9EEF5">https://cloudflare-dns.com/dns-query</text><text x="70" y="510" font-family="Consolas,monospace" font-size="15" fill="#E9EEF5">https://dns.google/dns-query</text><rect x="1284" y="463" width="256" height="55" rx="8" fill="#F22E8C" stroke="#FF75B7" stroke-width="2"/><text x="1331" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Test Resolvers</text>
<text x="35" y="603" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F7F8FA">Resolver results</text><text x="35" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#D1D5DB">PASS = valid NOERROR DNS reply · DNS ERROR = valid DoH exchange with a DNS error code · FAIL = unreachable or invalid response.</text><rect x="1301" y="584" width="265" height="34" rx="6" fill="#3B4046" stroke="#666C73"/><text x="1321" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F7F8FA">UP TO 512 URLS / RUN</text>
