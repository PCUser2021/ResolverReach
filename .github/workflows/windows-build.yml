name: Windows x64 and ARM64 build and installers

on:
  push:
    branches: [main, reactiveui-frp-refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: DNS protocol unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402

      - name: Restore test project
        run: dotnet restore tests/ResolverReach.Tests/ResolverReach.Tests.csproj

      - name: Run deterministic protocol tests
        run: dotnet test tests/ResolverReach.Tests/ResolverReach.Tests.csproj --configuration Release --no-restore --results-directory tests/ResolverReach.Tests/TestResults -- --report-trx --coverlet --coverlet-output-format cobertura --coverlet-output-format json

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ResolverReach-Test-Results
          path: tests/ResolverReach.Tests/TestResults/**
          if-no-files-found: warn
          retention-days: 14

  build-windows-x64:
    name: Build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402

      - name: Restore
        run: dotnet restore src/ResolverReach/ResolverReach.csproj

      - name: Publish self-contained x64 application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/publish, artifacts/installer | Out-Null
          dotnet publish src/ResolverReach/ResolverReach.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=2.4.0 --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found in the expected installation paths or PATH." }

      - name: Compile x64-compatible installer
        shell: pwsh
        run: |
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler not found." }
          & $iscc /DMyAppVersion=2.4.0 /DMyAppArchitecture=x64compatible /DMyAppOutputName=x64 "installer/ResolverReach.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "artifacts/installer/ResolverReach-Setup-x64.exe")) {
            throw "Expected x64 installer output was not created."
          }

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v7
        with:
          name: ResolverReach-Windows-x64
          path: artifacts/installer/ResolverReach-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

  build-windows-arm64:
    name: Build and package native Windows ARM64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402

      - name: Restore
        run: dotnet restore src/ResolverReach/ResolverReach.csproj

      - name: Publish self-contained native ARM64 application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/publish, artifacts/installer | Out-Null
          dotnet publish src/ResolverReach/ResolverReach.csproj --configuration Release --runtime win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=2.4.0 --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found in the expected installation paths or PATH." }

      - name: Compile native ARM64 installer
        shell: pwsh
        run: |
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler not found." }
          & $iscc /DMyAppVersion=2.4.0 /DMyAppArchitecture=arm64 /DMyAppOutputName=arm64 "installer/ResolverReach.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "artifacts/installer/ResolverReach-Setup-arm64.exe")) {
            throw "Expected native ARM64 installer output was not created."
          }

      - name: Upload Windows ARM64 installer
        uses: actions/upload-artifact@v7
        with:
          name: ResolverReach-Windows-arm64
          path: artifacts/installer/ResolverReach-Setup-arm64.exe
          if-no-files-found: error
          retention-days: 14


  build-macos-installers:
    name: Build macOS ${{ matrix.architecture }} app and installers
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            architecture: Apple-Silicon
            asset_suffix: arm64
          - rid: osx-x64
            architecture: Intel
            asset_suffix: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402

      - name: Restore
        run: dotnet restore src/ResolverReach/ResolverReach.csproj -r ${{ matrix.rid }}

      - name: Publish self-contained single-file macOS application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/publish artifacts/installer
          dotnet publish src/ResolverReach/ResolverReach.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version=2.4.0 \
            --output artifacts/publish

      - name: Assemble macOS app bundle and DMG/ZIP installers
        shell: bash
        run: |
          set -euo pipefail
          APP="artifacts/Resolver Reach.app"
          mkdir -p "$APP/Contents/MacOS" artifacts/installer
          cp -R artifacts/publish/. "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/ResolverReach"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Resolver Reach</string>
            <key>CFBundleDisplayName</key><string>Resolver Reach</string>
            <key>CFBundleIdentifier</key><string>com.pcuser2021.resolverreach</string>
            <key>CFBundleExecutable</key><string>ResolverReach</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.4.0</string>
            <key>CFBundleVersion</key><string>2.4.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/ResolverReach"
          hdiutil create -volname "Resolver Reach 2.4.0 (${{ matrix.architecture }})" \
            -srcfolder "$APP" -ov -format UDZO \
            "artifacts/installer/ResolverReach-2.4.0-macOS-${{ matrix.asset_suffix }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "artifacts/installer/ResolverReach-2.4.0-macOS-${{ matrix.asset_suffix }}.zip"
          test -s "artifacts/installer/ResolverReach-2.4.0-macOS-${{ matrix.asset_suffix }}.dmg"
          test -s "artifacts/installer/ResolverReach-2.4.0-macOS-${{ matrix.asset_suffix }}.zip"

      - name: Upload macOS installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ResolverReach-macOS-${{ matrix.asset_suffix }}
          path: |
            artifacts/installer/ResolverReach-2.4.0-macOS-${{ matrix.asset_suffix }}.dmg
            artifacts/installer/ResolverReach-2.4.0-macOS-${{ matrix.asset_suffix }}.zip
          if-no-files-found: error
          retention-days: 14

  verify-packaged-artifacts:
    name: Verify both installer artifacts
    needs: [build-windows-x64, build-windows-arm64, build-macos-installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows x64 installer artifact
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-Windows-x64
          path: artifacts/x64

      - name: Download native Windows ARM64 installer artifact
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-Windows-arm64
          path: artifacts/arm64


      - name: Download macOS Apple Silicon installers
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-macOS-arm64
          path: artifacts/macos-arm64

      - name: Download macOS Intel installers
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-macOS-x64
          path: artifacts/macos-x64

      - name: Verify all Windows and macOS installers exist and are non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/x64/ResolverReach-Setup-x64.exe
          test -s artifacts/arm64/ResolverReach-Setup-arm64.exe
          ls -lh artifacts/x64/ResolverReach-Setup-x64.exe artifacts/arm64/ResolverReach-Setup-arm64.exe
          test -s artifacts/macos-arm64/ResolverReach-2.4.0-macOS-arm64.dmg
          test -s artifacts/macos-arm64/ResolverReach-2.4.0-macOS-arm64.zip
          test -s artifacts/macos-x64/ResolverReach-2.4.0-macOS-x64.dmg
          test -s artifacts/macos-x64/ResolverReach-2.4.0-macOS-x64.zip
          ls -lh artifacts/macos-arm64/* artifacts/macos-x64/*
          sha256sum artifacts/x64/ResolverReach-Setup-x64.exe artifacts/arm64/ResolverReach-Setup-arm64.exe artifacts/macos-arm64/* artifacts/macos-x64/*

  publish-release:
    name: Publish tested v2.4.0 release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')
    needs: [build-windows-x64, build-windows-arm64, build-macos-installers, verify-packaged-artifacts, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download x64 installer
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-Windows-x64
          path: artifacts/x64

      - name: Download ARM64 installer
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-Windows-arm64
          path: artifacts/arm64


      - name: Download macOS Apple Silicon installers
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-macOS-arm64
          path: artifacts/macos-arm64

      - name: Download macOS Intel installers
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-macOS-x64
          path: artifacts/macos-x64

      - name: Publish GitHub Release with Windows and macOS installers
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v2.4.0
          target_commitish: ${{ github.sha }}
          name: Resolver Reach 2.4.0
          body: |
            Resolver Reach 2.4.0 — Windows 11 and macOS

            Windows installers:
            - ResolverReach-Setup-x64.exe: x64 Windows; also installable on Windows 11 ARM64 via x64 emulation.
            - ResolverReach-Setup-arm64.exe: native ARM64 Windows build.

            macOS installers:
            - ResolverReach-2.4.0-macOS-arm64.dmg / .zip: Apple Silicon (M1 or newer).
            - ResolverReach-2.4.0-macOS-x64.dmg / .zip: Intel Macs.
            - macOS builds are currently unsigned and not notarized; Gatekeeper may require the user to approve opening the app. Signing/notarization requires Apple Developer credentials.

            Highlights:
            - New dark titanium/glass icon family with cyan, blue, violet and spectral-magenta accents.
            - Status icons now distinguish a valid DNS response, a DNS error, and a failed check.
            - Save Logs exports the in-session diagnostics to a user-selected ZIP.
            - Existing resolver retry and HTTP/1.1 fallback behavior is retained.
            - License: MIT.
          files: |
            artifacts/x64/ResolverReach-Setup-x64.exe
            artifacts/arm64/ResolverReach-Setup-arm64.exe
            artifacts/macos-arm64/ResolverReach-2.4.0-macOS-arm64.dmg
            artifacts/macos-arm64/ResolverReach-2.4.0-macOS-arm64.zip
            artifacts/macos-x64/ResolverReach-2.4.0-macOS-x64.dmg
            artifacts/macos-x64/ResolverReach-2.4.0-macOS-x64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
