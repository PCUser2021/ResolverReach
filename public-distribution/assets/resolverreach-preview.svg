<title id="title">Resolver Reach 2.2.0 main-window design preview</title><desc id="desc">Illustration of the one-window interface with a dark slate palette, red status strip, two resolver-testing actions, empty results area and progress bar. This is not a captured screenshot of a running process.</desc>
