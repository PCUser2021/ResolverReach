name: Windows x64 and ARM64 build and installers

on:
  push:
    branches: [main, reactiveui-frp-refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ResolverReach/ResolverReach.csproj

      - name: Publish self-contained x64 application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/publish, artifacts/installer | Out-Null
          dotnet publish src/ResolverReach/ResolverReach.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=2.3.0 --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found in the expected installation paths or PATH." }

      - name: Compile x64-compatible installer
        shell: pwsh
        run: |
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler not found." }
          & $iscc /DMyAppVersion=2.3.0 /DMyAppArchitecture=x64compatible /DMyAppOutputName=x64 "installer/ResolverReach.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "artifacts/installer/ResolverReach-Setup-x64.exe")) {
            throw "Expected x64 installer output was not created."
          }

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v7
        with:
          name: ResolverReach-Windows-x64
          path: artifacts/installer/ResolverReach-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

  build-windows-arm64:
    name: Build and package native Windows ARM64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ResolverReach/ResolverReach.csproj

      - name: Publish self-contained native ARM64 application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/publish, artifacts/installer | Out-Null
          dotnet publish src/ResolverReach/ResolverReach.csproj --configuration Release --runtime win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=2.3.0 --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found in the expected installation paths or PATH." }

      - name: Compile native ARM64 installer
        shell: pwsh
        run: |
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler not found." }
          & $iscc /DMyAppVersion=2.3.0 /DMyAppArchitecture=arm64 /DMyAppOutputName=arm64 "installer/ResolverReach.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "artifacts/installer/ResolverReach-Setup-arm64.exe")) {
            throw "Expected native ARM64 installer output was not created."
          }

      - name: Upload Windows ARM64 installer
        uses: actions/upload-artifact@v7
        with:
          name: ResolverReach-Windows-arm64
          path: artifacts/installer/ResolverReach-Setup-arm64.exe
          if-no-files-found: error
          retention-days: 14

  verify-packaged-artifacts:
    name: Verify both installer artifacts
    needs: [build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows x64 installer artifact
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-Windows-x64
          path: artifacts/x64

      - name: Download native Windows ARM64 installer artifact
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-Windows-arm64
          path: artifacts/arm64

      - name: Verify both installers exist and are non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/x64/ResolverReach-Setup-x64.exe
          test -s artifacts/arm64/ResolverReach-Setup-arm64.exe
          ls -lh artifacts/x64/ResolverReach-Setup-x64.exe artifacts/arm64/ResolverReach-Setup-arm64.exe
          sha256sum artifacts/x64/ResolverReach-Setup-x64.exe artifacts/arm64/ResolverReach-Setup-arm64.exe

  publish-release:
    name: Publish tested v2.3.0 release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')
    needs: [build-windows-x64, build-windows-arm64, verify-packaged-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download x64 installer
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-Windows-x64
          path: artifacts/x64

      - name: Download ARM64 installer
        uses: actions/download-artifact@v8
        with:
          name: ResolverReach-Windows-arm64
          path: artifacts/arm64

      - name: Publish GitHub Release with both installers
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v2.3.0
          target_commitish: ${{ github.sha }}
          name: Resolver Reach 2.3.0
          body: |
            Resolver Reach 2.3.0 — Windows 11 x64 and native ARM64

            This release includes two architecture-specific installers:
            - ResolverReach-Setup-x64.exe: x64 Windows; also installable on Windows 11 ARM64 via x64 emulation.
            - ResolverReach-Setup-arm64.exe: native ARM64 Windows build.

            Highlights:
            - New dark titanium/glass icon family with cyan, blue, violet and spectral-magenta accents.
            - Status icons now distinguish a valid DNS response, a DNS error, and a failed check.
            - Save Logs exports the in-session diagnostics to a user-selected ZIP.
            - Existing resolver retry and HTTP/1.1 fallback behavior is retained.
            - License: MIT.
          files: |
            artifacts/x64/ResolverReach-Setup-x64.exe
            artifacts/arm64/ResolverReach-Setup-arm64.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
